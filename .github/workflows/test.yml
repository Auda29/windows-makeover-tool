name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows-powershell:
    name: Windows PowerShell 5.1
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Pester 5.7.1
        shell: powershell
        run: |
          Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Run tests
        shell: powershell
        run: |
          Import-Module Pester -RequiredVersion 5.7.1 -Force
          $result = Invoke-Pester .\tests\WindowsMakeover.Tests.ps1 -Output Detailed -PassThru
          if ($result.FailedCount -gt 0) {
              throw "$($result.FailedCount) Pester test(s) failed."
          }

  powershell:
    name: PowerShell 7
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Pester 5.7.1
        shell: pwsh
        run: |
          Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Run tests
        shell: pwsh
        run: |
          Import-Module Pester -RequiredVersion 5.7.1 -Force
          $result = Invoke-Pester .\tests\WindowsMakeover.Tests.ps1 -Output Detailed -PassThru
          if ($result.FailedCount -gt 0) {
              throw "$($result.FailedCount) Pester test(s) failed."
          }
