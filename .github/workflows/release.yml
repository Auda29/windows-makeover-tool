name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release, for example v0.2.0-beta
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  test:
    name: Test ${{ matrix.name }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows PowerShell 5.1
            shell: powershell
          - name: PowerShell 7
            shell: pwsh

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Install Pester 5.7.1
        shell: ${{ matrix.shell }}
        run: |
          Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Run tests
        shell: ${{ matrix.shell }}
        run: |
          Import-Module Pester -RequiredVersion 5.7.1 -Force
          $result = Invoke-Pester .\tests\WindowsMakeover.Tests.ps1 -Output Detailed -PassThru
          if ($result.FailedCount -gt 0) {
              throw "$($result.FailedCount) Pester test(s) failed."
          }

  release:
    name: Build and publish release
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Validate tag and build assets
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') {
              throw "Unsupported release tag: $env:RELEASE_TAG"
          }

          $version = $env:RELEASE_TAG.Substring(1)
          .\build\New-WMReleaseAssets.ps1 -Version $version -OutputDirectory .\dist | Format-List

          $standalone = "dist/windows-makeover-$version.ps1"
          $zip = "dist/windows-makeover-$version.zip"
          foreach ($asset in @($standalone, $zip, 'dist/SHA256SUMS.txt')) {
              if (-not (Test-Path -LiteralPath $asset -PathType Leaf)) {
                  throw "Release asset was not created: $asset"
              }
          }

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          $arguments = @(
              'release', 'create', $env:RELEASE_TAG,
              '--repo', $env:GITHUB_REPOSITORY,
              '--verify-tag',
              '--generate-notes',
              '--title', "Windows Makeover $env:RELEASE_TAG"
          )
          if ($env:RELEASE_TAG -match '-') {
              $arguments += '--prerelease'
          }
          $arguments += @(
              "dist/windows-makeover-$version.ps1",
              "dist/windows-makeover-$version.zip",
              'dist/SHA256SUMS.txt'
          )

          & gh @arguments
          if ($LASTEXITCODE -ne 0) {
              throw "GitHub release creation failed with exit code $LASTEXITCODE."
          }
